<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxes
    </title>
    <style>
        .container{
            height:100vh;
            width:100vw;
            margin:5%
        }

        .box{
            color: white;
            text-align: center;
            width: 150px;
            height:150px;
            font-weight:900;
        }
        #box1{
            position: relative; /*the allocated in the container space doesnt gets free all properties are relative to it.*/
            top:0%; /*top 0% is not affectable*/
            left: 30%;
        }
        #box2{
            position: absolute; /*the box becomes free of its parents and properties gets changed acc to screen.*/
            top:0%;
            left:20%; 
        }

        #box3{
            position:fixed; /*the box becomes fixed to a given position*/
            left:14%
        }

        #box4{
            position:sticky; /* becomes fixed after some scrolling the top otherwise it will be relative*/
            top:0;
            left:7%
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1" style="background-color: violet;">1</div>
        <div class="box" id="box2" style="background-color: blue;">2</div>
        <div class="box" id="box3" style="background-color: greenyellow;">3</div>
        <div class="box" id="box4" style="background-color: magenta;">4</div>
        <div class="box" style="background-color: palevioletred;">5</div>
        <div class="box" style="background-color: orange;">6</div>
        <div class="box" style="background-color: black;">7</div>
        <div class="box" style="background-color: silver;">8</div>
        <div class="box" style="background-color: brown;">9</div>
    </div>
</body>
</html>
