<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Indicator</title>
    <style>
        .box{
            position: relative;
            width:220px;
            height:220px;
            border: 1px solid black;
            border-radius: 8%;
            margin:auto;
            align-items: center;
            display: flex;
            justify-content: center;
            
        }

        .gauge{
            width:100%;
            height:100%;
            border-radius: 50%;
            background: conic-gradient(circle);
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="gauge">
        </div>
        <div class="text">75%</div>
    </div>
</body>
</html>
