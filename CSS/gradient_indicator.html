<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Indicator</title>
    <style>
        .container{
            background-color: palevioletred;
            position: relative;
            width:220px;
            height:220px;
            border: 1px solid palevioletred;
            border-radius: 8%;
            margin: auto;
            align-items: center;
            display: block;
            justify-content: center;
            
        }

        .gauge{
            
            padding:25%;
            align-items: center;
            justify-content: center;
            height:4rem;
            width:4rem;
            border: 25px solid black;
            border-radius: 100%;
            background: conic-gradient(circle);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gauge">
            <div class="text">
                77%
            </div>
        </div>
    </div>
</body>
</html>
