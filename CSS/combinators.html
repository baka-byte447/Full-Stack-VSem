<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>combinators</title>

    <style>
        section h2{ /*all children , grandchilderen and so on of section that is h2*/
            color:yellow;
            text-shadow: 1px 1px 0 black;
        }

        section>h2{ /*all direct h2 children of section*/
            text-transform: lowercase;
        }

        h2+p{ /*first sibling of h2*/
            color:blue;
        }

        h2~p{ /*all the siblings of h2*/
            text-transform: uppercase;
        }
    </style>

</head>
<body>
    <section>
        <h2>
            Heading
        </h2>
        <p>Para1</p>
        <p>Para2</p>
        <div><h2>Heading 2</h2></div>
    </section>

</body>
</html>
