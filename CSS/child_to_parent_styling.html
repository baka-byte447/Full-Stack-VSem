<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>child to parent</title>

    <style>
        div:has(h2,h3){
            background-color: black;
            color:greenyellow;
        }

        .div:is(h2,h3){
            color:pink;
        }
    </style>
</head>
<body>
    <div><p>div has paragraph only</p></div>
<div class="div">
    <p>lorem ipsum</p>
    <h2>H2 heading </h2>
</div>
<div>
    <h2>Heading</h2>
    <h3>Heading</h3>
    <div class="div">
        <h2>Heading inside div</h2>
        <h3>H3 heading</h3>
    </div>
</div>
</body>
</html>
