<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Dash</title>

    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows:repeat(3,1fr);
            grid-template-areas:
                "box1 box1 box1"
                "box2 box3 box3"
                "box2 box4 box5"
                "box6 box6 box6";
            gap:2rem;
        }

        .box{
            min-width 100px;
            min-height:200px;
            border: 1px solid black;
            border-radius: 0.6rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" style="grid-area:box1"><h1>Header</h1></div>
        <div class="box" style="grid-area:box2"><h1>sidebar</h1></div>
        <div class="box" style="grid-area:box3"><h1>Main Content</h1></div>
        <div class="box" style="grid-area:box4"><h1>card1</h1></div>
        <div class="box" style="grid-area:box5"><h1>card2</h1></div>
        <div class="box" style="grid-area:box6"><h1>Footer</h1></div>
    </div>
</body>
</html>
