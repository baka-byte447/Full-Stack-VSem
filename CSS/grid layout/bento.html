<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Box</title>

    <style>

        .container{
            display: grid;
            grid-template-columns:repeat(3,1fr);
            grid-template-rows: repeat(3,150px);
            grid-template-areas:
                "box1 box1 box2"
                "box3 box4 box2"
                "box3 box5 box5";
            gap: 15px;
        }
        .container>div{
            outline: 1px solid black;
            border-radius: 6px;
        }

        
    </style>

</head>
<body>
    <div class="container">
        <div class="box" style="grid-area: box1"></div>
            <div class="box" style="grid-area: box2"></div>
            <div class="box" style="grid-area: box3"></div>
            <div class="box" style="grid-area: box4"></div>
            <div class="box" style="grid-area: box5"></div>
            <div class="box" style="grid-area: box6"></div>
    </div>
</body>
</html>
