<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard grid`</title>

    <style>
        .container{
            display: grid;
        }

        .box{
            background-color: beige;
            border: 2px solid black;
            min-width: 100px;
            min-height:100px
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="box" style="grid-area: box1"></div>
        <div class="box" style="grid-area: box2"></div>
        <div class="box" style="grid-area: box3"></div>
        <div class="box" style="grid-area: box4"></div>
        <div class="box" style="grid-area: box5"></div>
        <div class="box" style="grid-area: box6"></div>
    </div>

</body>
</html>
