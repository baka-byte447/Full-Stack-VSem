<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        .navbar{
            display:flex;
            margin: auto;
            border: 2px solid blue;
            flex-direction: row;
            justify-content: space-between;
        }
        .logo{
            flex:1
        }
        .nav-buttons{
            display: flex;
            list-style-type: none;
            flex:1;
            column-gap: 10%;
        }

    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">
            LOGO
        </div>
        <div class="nav-buttons">
            <ul>
                <li>Home</li>
                <li>Products</li>
                <li>Support</li>
                <li>About</li>
            </ul>
        </div>
    </div>
</body>
</html>
