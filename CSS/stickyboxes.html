<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxes
    </title>
    <style>
        .container{
            height:100vh;
            width:100vw;
            margin:0%;
            padding: 0;
        }

        .box{
            top:0%;
            color: white;
            text-align: center;
            width: 100%;
            height:150px;
            font-weight:900;
        }
        #box1{
            position: sticky;
            top:5%;            

        }
        #box2{
            position: sticky;
            top:10%;
        }

        #box3{
            position: sticky;
            top:15%;
        }

        #box4{
            position: sticky;
            top:20%;
        }

        #box5{
            position: sticky;
            top:25%;
        }

        #box6{
            position: sticky;
            top:30%;
        }

        #box7{
            position: sticky;
            top:35%;
        }

        #box8{
            position: sticky;
            top:40%;
        }

        #box9{
            position: sticky;
            top:45%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1" style="background-color: violet;">1</div>
        <div class="box" id="box2" style="background-color: blue;">2</div>
        <div class="box" id="box3" style="background-color: greenyellow;">3</div>
        <div class="box" id="box4" style="background-color: magenta;">4</div>
        <div class="box" id="box5" style="background-color: palevioletred;">5</div>
        <div class="box" id="box6" style="background-color: orange;">6</div>
        <div class="box" id="box7" style="background-color: black;">7</div>
        <div class="box" id="box8" style="background-color: silver;">8</div>
        <div class="box" id="box9" style="background-color: brown;">9</div>
    </div>
</body>
</html>
