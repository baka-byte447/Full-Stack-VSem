<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEXBOX</title>

    <style>
        .container{
            display: flex;
            flex-direction: row-reverse;
        }

        #one{
            flex: 1;
            background-color: orange;
            height:100px;
        }
        #two{
            flex: 2;
            background-color: blue;
            height:100px;
            
        }
        #three{
            flex: 3;
            background-color: black;
            height:100px;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="one"></div>
        <div id="two"></div>
        <div id="three"></div>
    </div>
</body>
</html>
