<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout
    </title>
    <style>
        .container{
            display: flex;
        }
        .navbar{
            display: flex;
            background-color: crimson;
            flex-direction:column;
            width: 220px;
            justify-content:space-between;
            height:100vh;
            border:3px solid black
        }

        .logo{
            text-align: center;
            text-decoration: underline;
        }

        .items{
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            height:50%
        }
        .Page{
            border:3px solid grey
        }
            .Cards{
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        padding: 20px;
        border:2px solid black
            }
        .cards{
            border: 2px solid black;
            width: 200px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 9px;
        }

        body{
            margin: 0;
            font-family: Arial, sans-serif;
            background: aquamarine;
        }

        .table-section{
    margin: 20px;
}


table{
    width: 100%;
    border-collapse: collapse;
    background: white;
    box-shadow: 0 0 8px rgba(0,0,0,0.2);
}

th, td{
    border: 1px solid #ddd;
    padding: 12px;
    text-align: left;
}

    </style>
</head>
<body>
    <div class="container">


        <div class="navbar">
            <div class="logo"><h2>LOGO</h2></div>
            <div class="items">
                <div class="item">Home</div>
                <div class="item">Services</div>
                <div class="item">Contact</div>
                <div class="item">About</div>
            </div>
            
        </div>

        <div class="Page">
            <div class="Cards">
                <div class="cards">1</div>
                <div class="cards">2</div>
                <div class="cards">3</div>
                <div class="cards">4</div>
                <div class="cards">5</div>
            </div>

            <div class="table-section">
    <h2>Recent Orders</h2>

            <table>
                <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Status</th>
                    <th>Amount</th>
                </tr>

                <tr>
                    <td>#1001</td>
                    <td>Jeramine Lamar Cole</td>
                    <td>Completed</td>
                    <td>$120</td>
                </tr>

                <tr>
                    <td>#1002</td>
                    <td>Micheal Scott</td>
                    <td>Pending</td>
                    <td>$80</td>
                </tr>

                <tr>
                    <td>#1003</td>
                    <td>David Wallas</td>
                    <td>Cancelled</td>
                    <td>$45</td>
                </tr>

                <tr>
                    <td>#1004</td>
                    <td>Kevin Malone</td>
                    <td>Completed</td>
                    <td>$210</td>
                </tr>
            </table>
        </div>
        </div>
        </div>
</body>
</html>
