<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <style>
        @layer special, base; /*this means base overwrites special*/

        @layer base{

            body{
                background-color: aquamarine;
            }
            p{
                font-size:30px;
                color:red;
            }

            button{
                font-size:20px;
                border-radius:50%;
                width:150px;
                height:150px;
                background-color: white;
                border:1px solid greenyellow;
                box-shadow:3px 3px 5px;
            }

            button:active{
                box-shadow:inset 3px 3px 5px grey;
            }
        }
        @layer special{

            body{
                background-color: whitesmoke;
            }
            p{
                font-size:4rem;
                color:blue;
            }

            button{
                font-size:20px;
                border-radius:50%;
                width:150px;
                height:150px;
                background-color: white;
                border:1px solid greenyellow;
                box-shadow:3px 3px 5px;
            }

            button:active{
                box-shadow:inset -3px -3px -5px grey;
            }


        }

        

    </style>
</head>
<body>
    <p>Specificity, Cascade Layers important for theory</p>
    <button>Press Me GENTLY!!</button>
</body>
</html>
