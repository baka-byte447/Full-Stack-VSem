<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hit Cricket</title>

    <style>
        .main{min-height: 80vh;
            margin:0;
            padding:2rem;
            display:flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border:4px solid darkblue;
            border-radius: 5px;
            background-color: lightgreen;
        }

        .stats{

            padding:1rem;
            border:2px solid black;
            border-radius:2px;
        }

        .pitch{
            padding:1rem;
            width:80%;
            height:100px;
            background-color: blanchedalmond;
            border:1px solid brown;
            display:flex;
            align-items: center;
            justify-content: space-between;
        }

        .ball{
            height:10px;
            width: 10px;
            border:1px solid red;
            border-radius: 50%;
            background-color: red;
            
        }

        .stumps{
            height: 40px;
            width:20px;
            border:2px solid black;

        }

        .hitBox{
            background-color: #fff;
            height:80px;
            right:180px;
            width:40px;
            border:1px solid black;
            position:absolute;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="stats">
            <h2 class="title">Super Over</h2>
            <p class="runsNeeded">Runs Needed: </p>
            <p class="ballsLeft">Balls Left: </p>
            <p class="wickets">Wickets: </p>
        </div>

        <div class="pitch">
            <div class="ball"></div>
            <div class="hitBox"></div>
            <div class="stumps"></div>
        </div>

        <div class="button">
            <button class="hit">HIT</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
